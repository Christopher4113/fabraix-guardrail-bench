[project]
name = "fabraix-guardrail-bench"
version = "0.1.0"
description = "Cheap multi-turn attacker vs Fabraix Playground challenges, with swappable guardrail judges and ACE-style cost accounting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # the vendored engine's own deps
    "pydantic>=2.12",
    "structlog>=22.1",
    "pyyaml>=6.0.1",
    "httpx>=0.28",
    # the judge under test
    "judgeman[judge]>=0.1.3",
    "python-dotenv>=1.0",
]

[project.scripts]
bench = "bench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]
